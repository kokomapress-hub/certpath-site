<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Test — CertPath Publishing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=12">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="logo">
        <svg class="logo-shield" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><path fill="#1B2A4A" d="M6 4h22l6 6v20l-14 6L6 30V4z"/><rect x="12" y="14" width="16" height="3" fill="#fff"/><rect x="12" y="20" width="16" height="3" fill="#fff"/></svg>
        <span class="logo-text">CertPath <span class="gold">Publishing</span></span>
      </a>
      <nav class="nav">
        <a href="/pmp-course" id="pmpCourseLink" style="display:none;color:var(--gold,#e0a020);font-weight:700">🎬 My PMP Course</a>
        <a href="/">Home</a>
        <a href="/access">My Tests</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 2rem 2rem 5rem;">
    <div id="quizApp">Loading practice test…</div>
  </main>

  <script>
    // Show a persistent link back to the PMP video course for paid PMP
    // customers (or anyone taking a PMP test), so clicking around the quiz
    // never strands them away from their videos.
    (function () {
      try {
        var book = new URLSearchParams(location.search).get('book') || '';
        var hasPmp = false;
        try { hasPmp = !!JSON.parse(localStorage.getItem('certpath_pmp_access') || 'null'); } catch (e) {}
        if (book === 'pmp' || book === 'pmp-free' || hasPmp) {
          var l = document.getElementById('pmpCourseLink');
          if (l) l.style.display = '';
        }
      } catch (e) {}
    })();
  </script>
  <script src="/js/quiz.js?v=20260919"></script>
</body>
</html>

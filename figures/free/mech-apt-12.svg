<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0E1F3F"/></marker><marker id="as" markerWidth="9" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 z" fill="#0E1F3F"/></marker></defs><rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/><text x="320" y="26" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#0E1F3F" text-anchor="middle" font-weight="bold">HAND HYDRAULIC PRESS</text><rect x="70" y="150" width="120" height="120" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><text x="130" y="216" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">RESERVOIR</text><rect x="190" y="236" width="180" height="22" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><rect x="370" y="120" width="120" height="160" fill="#FFFFFF" stroke="#0E1F3F" stroke-width="2"/><rect x="372" y="122" width="116" height="60" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><rect x="390" y="60" width="80" height="62" fill="#F5F3EE" stroke="#0E1F3F" stroke-width="2"/><text x="430" y="96" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">RAM</text><line x1="430" y1="122" x2="430" y2="60" stroke="#0E1F3F" stroke-width="2"/><line x1="130" y1="150" x2="130" y2="96" stroke="#0E1F3F" stroke-width="2"/><line x1="96" y1="96" x2="250" y2="76" stroke="#0E1F3F" stroke-width="4"/><circle cx="250" cy="76" r="8" fill="#DADFE5" stroke="#0E1F3F" stroke-width="0"/><line x1="112" y1="60" x2="104" y2="92" stroke="#0E1F3F" stroke-width="2" marker-end="url(#ah)"/><text x="120" y="48" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">LEVER</text><circle cx="300" cy="150" r="26" fill="#FFFFFF" stroke="#0E1F3F" stroke-width="2"/><text x="300" y="146" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0E1F3F" text-anchor="middle" font-weight="normal">PSI</text><text x="300" y="196" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0E1F3F" text-anchor="middle" font-weight="normal">GAUGE</text><line x1="300" y1="176" x2="300" y2="200" stroke="#0E1F3F" stroke-width="1"/><text x="40" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">NOTE: THE PRESS ONCE MOVED SMOOTHLY. IT NOW LOWERS IN JERKS,</text><text x="40" y="354" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">THE RAM LAGS THE LEVER, AND THE RAM SPRINGS BACK A LITTLE WHEN</text><text x="40" y="378" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">THE LEVER IS RELEASED. GAUGE AND OIL LEVEL ARE NORMAL.</text></svg>
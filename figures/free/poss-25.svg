<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0E1F3F"/></marker><marker id="as" markerWidth="9" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 z" fill="#0E1F3F"/></marker></defs><rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/><text x="320" y="32" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#0E1F3F" text-anchor="middle" font-weight="bold">SEAL FLUSH FLOW REQUIRED, GPM</text><text x="320" y="58" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">MANUFACTURER'S TABLE</text><rect x="80" y="104" width="492" height="56" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><rect x="80" y="160" width="492" height="170" fill="#FFFFFF" stroke="#0E1F3F" stroke-width="2"/><path d="M220 104 L220 330 M308 104 L308 330 M396 104 L396 330 M484 104 L484 330 M80 160 L572 160 M80 194 L572 194 M80 228 L572 228 M80 262 L572 262 M80 296 L572 296 M80 330 L572 330 " fill="none" stroke="#0E1F3F" stroke-width="1.2"/><g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0E1F3F" text-anchor="middle" font-weight="bold"><text x="150" y="128">PUMP SUCTION</text><text x="150" y="148">PRESSURE, PSIG</text><text x="264" y="128">LIQUID</text><text x="264" y="148">100 F</text><text x="352" y="128">LIQUID</text><text x="352" y="148">140 F</text><text x="440" y="128">LIQUID</text><text x="440" y="148">180 F</text><text x="528" y="128">LIQUID</text><text x="528" y="148">220 F</text></g><g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal"><text x="150" y="183">40</text><text x="264" y="183">1.0</text><text x="352" y="183">1.4</text><text x="440" y="183">1.9</text><text x="528" y="183">2.5</text><text x="150" y="217">60</text><text x="264" y="217">1.2</text><text x="352" y="217">1.7</text><text x="440" y="217">2.3</text><text x="528" y="217">3.0</text><text x="150" y="251">80</text><text x="264" y="251">1.5</text><text x="352" y="251">2.1</text><text x="440" y="251">2.8</text><text x="528" y="251">3.6</text><text x="150" y="285">100</text><text x="264" y="285">1.8</text><text x="352" y="285">2.5</text><text x="440" y="285">3.4</text><text x="528" y="285">4.3</text><text x="150" y="319">120</text><text x="264" y="319">2.2</text><text x="352" y="319">3.0</text><text x="440" y="319">4.0</text><text x="528" y="319">5.1</text></g><text x="320" y="348" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">WHERE A SUCTION PRESSURE FALLS BETWEEN TWO ROWS,</text><text x="320" y="370" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">READ THE NEXT HIGHER PRESSURE ROW. TEMPERATURE</text><text x="320" y="392" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">COLUMNS ARE READ AS MARKED.</text></svg>
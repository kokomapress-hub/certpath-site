<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0E1F3F"/></marker><marker id="as" markerWidth="9" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 z" fill="#0E1F3F"/></marker></defs><rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/><text x="320" y="26" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#0E1F3F" text-anchor="middle" font-weight="bold">MOTOR AND PUMP - BELT DRIVE</text><rect x="70" y="150" width="120" height="90" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><text x="130" y="200" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">MOTOR</text><text x="130" y="128" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">1,750 RPM</text><circle cx="230" cy="195" r="34" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><circle cx="230" cy="195" r="29" fill="#FFFFFF" stroke="#0E1F3F" stroke-width="1.2"/><circle cx="230" cy="195" r="3.5" fill="#0E1F3F" stroke="#0E1F3F" stroke-width="0"/><text x="230" y="268" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">6 IN</text><text x="230" y="288" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">MOTOR SHEAVE</text><circle cx="390" cy="195" r="42" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><circle cx="390" cy="195" r="37" fill="#FFFFFF" stroke="#0E1F3F" stroke-width="1.2"/><circle cx="390" cy="195" r="3.5" fill="#0E1F3F" stroke="#0E1F3F" stroke-width="0"/><text x="390" y="268" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">7.5 IN</text><text x="390" y="288" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">PUMP SHEAVE</text><line x1="230" y1="161" x2="390" y2="153" stroke="#0E1F3F" stroke-width="2"/><line x1="230" y1="229" x2="390" y2="237" stroke="#0E1F3F" stroke-width="2"/><line x1="196" y1="195" x2="230" y2="195" stroke="#0E1F3F" stroke-width="2"/><circle cx="480" cy="195" r="30" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><polygon points="450,171 450,219 434,219 434,171" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><text x="480" y="200" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="bold">PUMP</text><line x1="432" y1="195" x2="450" y2="195" stroke="#0E1F3F" stroke-width="3"/><line x1="70" y1="250" x2="560" y2="250" stroke="#0E1F3F" stroke-width="2"/><text x="40" y="340" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">NOTE: THE BELT DOES NOT SLIP. SHEAVE DIAMETERS ARE AS MARKED.</text><text x="40" y="364" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">THE PUMP DEVELOPS 90 FT OF HEAD WHEN IT IS TURNED AT 1,750 RPM.</text></svg>
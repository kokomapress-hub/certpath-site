<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0E1F3F"/></marker><marker id="as" markerWidth="9" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 z" fill="#0E1F3F"/></marker></defs><rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/><text x="320" y="26" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#0E1F3F" text-anchor="middle" font-weight="bold">CRATE ON A SURFACE THAT IS SLOWLY TILTED</text><g transform="rotate(-14 200 300)"><line x1="60" y1="300" x2="420" y2="300" stroke="#0E1F3F" stroke-width="3"/><rect x="170" y="156" width="96" height="144" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><circle cx="218" cy="228" r="6" fill="#DDA63B" stroke="#0E1F3F" stroke-width="2"/></g><line x1="476" y1="130" x2="536" y2="130" stroke="#0E1F3F" stroke-width="1"/><line x1="476" y1="274" x2="536" y2="274" stroke="#0E1F3F" stroke-width="1"/><line x1="530" y1="130" x2="530" y2="274" stroke="#0E1F3F" stroke-width="1.2" marker-start="url(#as)" marker-end="url(#ah)"/><text x="538" y="207" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">72 IN</text><line x1="380" y1="130" x2="380" y2="106" stroke="#0E1F3F" stroke-width="1"/><line x1="476" y1="130" x2="476" y2="106" stroke="#0E1F3F" stroke-width="1"/><line x1="380" y1="112" x2="476" y2="112" stroke="#0E1F3F" stroke-width="1.2" marker-start="url(#as)" marker-end="url(#ah)"/><text x="428" y="106" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">30 IN</text><rect x="380" y="130" width="96" height="144" fill="#FFFFFF" stroke="#0E1F3F" stroke-width="1" stroke-dasharray="6 4"/><text x="428" y="300" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">SAME CRATE</text><text x="40" y="350" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">NOTE: THE CRATE IS UNIFORM, SO ITS CENTRE OF GRAVITY IS AT ITS</text><text x="40" y="372" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">MIDDLE, SHOWN BY THE MARKED POINT. THE SURFACE GRIPS WELL</text><text x="40" y="394" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">ENOUGH THAT THE CRATE TIPS RATHER THAN SLIDES.</text></svg>
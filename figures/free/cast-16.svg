F3F" stroke-width="2"/><line x1="570" y1="70" x2="570" y2="102" stroke="#0E1F3F" stroke-width="2" marker-end="url(#ah)"/><text x="44" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0E1F3F" text-anchor="middle" font-weight="bold">Y</text><line x1="70" y1="250" x2="270" y2="250" stroke="#0E1F3F" stroke-width="3"/><path d="M70 244 L70 256 M90 244 L90 256 M110 244 L110 256 M130 244 L130 256 M150 244 L150 256 M170 244 L170 256 M190 244 L190 256 M210 244 L210 256 M230 244 L230 256 M250 244 L250 256 M270 244 L270 256 " fill="none" stroke="#0E1F3F" stroke-width="1"/><rect x="58" y="220" width="26" height="26" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><polygon points="118,276 142,276 130,254" fill="#DDA63B" stroke="#0E1F3F" stroke-width="2"/><line x1="250" y1="210" x2="250" y2="242" stroke="#0E1F3F" stroke-width="2" marker-end="url(#ah)"/><text x="344" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0E1F3F" text-anchor="middle" font-weight="bold">Z</text><line x1="370" y1="250" x2="570" y2="250" stroke="#0E1F3F" stroke-width="3"/><path d="M370 244 L370 256 M390 244 L390 256 M410 244 L410 256 M430 244 L430 256 M450 244 L450 256 M470 244 L470 256 M490 244 L490 256 M510 244 L510 256 M530 244 L530 256 M550 244 L550 256 M570 244 L570 256 " fill="none" stroke="#0E1F3F" stroke-width="1"/><rect x="358" y="220" width="26" height="26" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><polygon points="398,276 422,276 410,254" fill="#DDA63B" stroke="#0E1F3F" stroke-width="2"/><line x1="550" y1="210" x2="550" y2="242" stroke="#0E1F3F" stroke-width="2" marker-end="url(#ah)"/><text x="40" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">NOTE: MARKS ALONG EACH BAR ARE EQUALLY SPACED. THE BLOCK SITS</text><text x="40" y="352" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">AT THE LEFT END, THE TRIANGLE IS
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400"><defs><marker id="ah" markerWidth="9" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0E1F3F"/></marker><marker id="as" markerWidth="9" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 z" fill="#0E1F3F"/></marker></defs><rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/><text x="320" y="26" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#0E1F3F" text-anchor="middle" font-weight="bold">COUNTERBALANCED LIFT TRUCK</text><rect x="230" y="150" width="200" height="110" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><text x="510" y="180" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">TRUCK 6,000 LB</text><rect x="180" y="120" width="26" height="170" fill="#DADFE5" stroke="#0E1F3F" stroke-width="2"/><line x1="140" y1="290" x2="600" y2="290" stroke="#0E1F3F" stroke-width="3"/><circle cx="300" cy="270" r="22" fill="#FFFFFF" stroke="#0E1F3F" stroke-width="2"/><circle cx="430" cy="270" r="22" fill="#FFFFFF" stroke="#0E1F3F" stroke-width="2"/><text x="300" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">FRONT AXLE</text><line x1="300" y1="248" x2="300" y2="96" stroke="#0E1F3F" stroke-width="1" stroke-dasharray="6 4"/><circle cx="370" cy="200" r="6" fill="#DDA63B" stroke="#0E1F3F" stroke-width="2"/><line x1="370" y1="200" x2="370" y2="96" stroke="#0E1F3F" stroke-width="1" stroke-dasharray="6 4"/><rect x="120" y="200" width="60" height="56" fill="#F5F3EE" stroke="#0E1F3F" stroke-width="2"/><text x="150" y="190" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">LOAD</text><circle cx="150" cy="228" r="6" fill="#DDA63B" stroke="#0E1F3F" stroke-width="2"/><line x1="150" y1="228" x2="150" y2="96" stroke="#0E1F3F" stroke-width="1" stroke-dasharray="6 4"/><line x1="300" y1="90" x2="370" y2="90" stroke="#0E1F3F" stroke-width="1.2" marker-start="url(#as)" marker-end="url(#ah)"/><text x="335" y="84" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">32 IN</text><line x1="150" y1="66" x2="300" y2="66" stroke="#0E1F3F" stroke-width="1.2" marker-start="url(#as)" marker-end="url(#ah)"/><text x="225" y="60" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="middle" font-weight="normal">24 IN</text><text x="40" y="366" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">NOTE: THE MARKED POINTS ARE THE CENTRES OF GRAVITY OF THE TRUCK</text><text x="40" y="388" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0E1F3F" text-anchor="start" font-weight="normal">AND OF THE LOAD. THE TRUCK WOULD TIP ABOUT THE FRONT AXLE.</text></svg>
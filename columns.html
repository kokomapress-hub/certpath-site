<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Columns — CertPath Publishing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #FFFFFF;
      --ink: #26354B;
      --ink-soft: #6B7788;
      --line: rgba(38, 53, 75, .16);
      --line-strong: rgba(38, 53, 75, .35);
      --tab: #D3E3CB;     /* set per list from the palette in the script */
      --tick: #9DB593;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
    }
    button { font-family: inherit; }

    /* Tab bar: phone only */
    .tabs { display: none; }

    /* Desktop: lists side by side, scrolls sideways when there are many */
    .columns {
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .col {
      flex: 1 0 16rem;
      min-width: 16rem;
      padding: clamp(1rem, 2.5vw, 2rem);
      border-right: 1px solid var(--line);
    }
    .col-new {
      flex: 0 0 auto;
      padding: clamp(1rem, 2.5vw, 2rem);
    }

    .col-head { margin: 0 0 1rem; }
    .chip {
      display: inline-block;
      max-width: 100%;
      padding: .4rem .8rem;
      border: 0;
      border-radius: 6px;
      background: var(--tab);
      color: var(--ink);
      font: 500 .8125rem/1.2 var(--sans);
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip:focus-visible, .tab:focus-visible, .tab-add:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .chip-add, .tab-add {
      background: transparent;
      border: 1px dashed var(--line-strong);
      color: var(--ink-soft);
    }

    /* Edit panel: name, color, delete */
    .panel {
      display: flex;
      flex-direction: column;
      gap: .9rem;
      margin: 0 0 1rem;
      padding: .9rem;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .name {
      width: 100%;
      height: 2.25rem;
      padding: 0 0 .1rem;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 500 1rem/1.4 var(--sans);
      -webkit-appearance: none;
      appearance: none;
    }
    .name:focus-visible { border-bottom-color: var(--ink); }
    .swatches { display: flex; flex-wrap: wrap; gap: .5rem; }
    .sw {
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sw[aria-pressed="true"] { border-color: var(--ink); }
    .sw:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .panel-actions { display: flex; flex-wrap: wrap; gap: .5rem 1rem; }
    .link {
      padding: .25rem 0;
      border: 0;
      background: none;
      color: var(--ink);
      font: 500 .8125rem/1.2 var(--sans);
      cursor: pointer;
    }
    .link.danger { color: #A33232; }
    .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }

    .list { list-style: none; margin: 0; padding: 0; }
    .row { display: flex; align-items: center; gap: .5rem; }

    /* Small square you tick off */
    .box {
      position: relative;
      flex: none;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .box::before {
      content: "";
      position: absolute;
      inset: .4rem;
      border: 2px solid var(--tick);
      border-radius: 2px;
    }
    .box[aria-checked="true"]::before { background: var(--tick); }
    .box[aria-checked="true"]::after {
      content: "";
      position: absolute;
      left: .82rem;
      top: .52rem;
      width: .3rem;
      height: .6rem;
      border: solid var(--ink);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .box:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 4px; }

    /* One line of text */
    .write {
      flex: 1;
      min-width: 0;
      height: 2.5rem;
      padding: 0 0 .1rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 400 1rem/1.5 var(--sans);
      -webkit-appearance: none;
      appearance: none;
    }
    .write:focus-visible { border-bottom-color: var(--ink); }
    .row.done .write { color: var(--ink-soft); text-decoration: line-through; }

    /* Always-visible way to add another line */
    .add {
      display: flex;
      align-items: center;
      gap: .5rem;
      width: 100%;
      height: 2.5rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink-soft);
      font: 400 .875rem/1 var(--sans);
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .add-box { position: relative; flex: none; width: 2rem; height: 2rem; }
    .add-box::before {
      content: "+";
      position: absolute;
      inset: .4rem;
      display: grid;
      place-items: center;
      border: 2px dashed var(--tick);
      border-radius: 2px;
      color: var(--ink-soft);
      font: 500 .9rem/1 var(--sans);
    }
    .add:hover { color: var(--ink); }
    .add:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }

    /* Phone: one list at a time, switched with the colored tabs */
    @media (max-width: 640px) {
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem;
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 1rem 1rem 1.1rem;
        background: var(--bg);
      }
      .tab, .tab-add {
        position: relative;
        max-width: 100%;
        padding: .55rem .8rem;
        border-radius: 6px;
        font: 500 .8125rem/1.2 var(--sans);
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
      }
      .tab {
        border: 0;
        background: var(--tab);
        color: var(--ink);
        opacity: .6;
      }
      .tab[aria-selected="true"] { opacity: 1; overflow: visible; }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 0; right: 0; bottom: -.4rem;
        height: 2px;
        background: var(--ink);
      }

      .columns { display: block; overflow: visible; min-height: 0; }
      .col {
        display: none;
        min-width: 0;
        border-right: 0;
        min-height: calc(100vh - 5rem);
        min-height: calc(100dvh - 5rem);
        padding: .25rem 1.25rem 2rem 1rem;
      }
      .col.is-active { display: block; }
      .col-head { display: none; }
      .col-new { display: none; }
    }
  </style>
</head>
<body>
  <div class="tabs" id="tabs" role="tablist" aria-label="Lists"></div>
  <main class="columns" id="columns"></main>

  <script>
    // Everything is saved in this browser only; nothing is sent anywhere.
    (function () {
      var KEY = 'certpath-todo-v2';
      var OLD_KEY = 'certpath-todo-v1';
      var OLD_TAB_KEY = 'certpath-todo-tab';
      var START_ROWS = 10;
      var MIN_ROWS = 5;

      // Mild colors: tab/chip color and the darker tick-square color
      var PALETTE = [
        { n: 'Sage',     tab: '#D3E3CB', tick: '#9DB593' },
        { n: 'Sand',     tab: '#F0E1B8', tick: '#D3BB7C' },
        { n: 'Mist',     tab: '#CBDDEB', tick: '#8FAAC1' },
        { n: 'Blush',    tab: '#EDCFC7', tick: '#CB9C91' },
        { n: 'Lavender', tab: '#DDD5EC', tick: '#A99BC9' },
        { n: 'Aqua',     tab: '#C6E6E0', tick: '#86BAB0' },
        { n: 'Peach',    tab: '#F6DCC3', tick: '#DEAA80' },
        { n: 'Lime',     tab: '#E1EBBE', tick: '#B2C36A' },
        { n: 'Rose',     tab: '#F0D0DD', tick: '#CD91AB' },
        { n: 'Slate',    tab: '#D6DCE4', tick: '#9AA7B7' }
      ];
      var DEFAULT_NAMES = ['4 Little Dinos', 'Prasad Audio', 'CPP', 'KDP'];

      function blank() { return { t: '', d: false }; }
      function blankRows(n) { var r = []; for (var i = 0; i < n; i++) r.push(blank()); return r; }
      function newId() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
      function h(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }
      function applyColor(node, idx) {
        var c = PALETTE[idx % PALETTE.length];
        node.style.setProperty('--tab', c.tab);
        node.style.setProperty('--tick', c.tick);
      }
      function cleanRows(rows) {
        var out = [];
        (Array.isArray(rows) ? rows : []).forEach(function (r) {
          if (r && typeof r === 'object') out.push({ t: String(r.t || ''), d: !!r.d });
        });
        while (out.length < START_ROWS) out.push(blank());
        if (out[out.length - 1].t) out.push(blank());
        return out;
      }

      function load() {
        try {
          var v2 = JSON.parse(localStorage.getItem(KEY));
          if (v2 && Array.isArray(v2.lists) && v2.lists.length) {
            v2.lists.forEach(function (l) {
              l.rows = cleanRows(l.rows);
              if (typeof l.color !== 'number') l.color = 0;
              if (typeof l.name !== 'string') l.name = '';
            });
            if (!v2.lists.some(function (l) { return l.id === v2.active; })) v2.active = v2.lists[0].id;
            return v2;
          }
        } catch (e) {}
        // First run on the new version: bring over the four original lists and their items
        var lists = DEFAULT_NAMES.map(function (name, i) {
          return { id: 'l' + (i + 1), name: name, color: i, rows: blankRows(START_ROWS) };
        });
        try {
          var v1 = JSON.parse(localStorage.getItem(OLD_KEY));
          if (Array.isArray(v1) && v1.length === 4) v1.forEach(function (rows, i) { lists[i].rows = cleanRows(rows); });
        } catch (e) {}
        var active = 'l1';
        try {
          var t = parseInt(localStorage.getItem(OLD_TAB_KEY), 10);
          if (t >= 1 && t <= 4) active = 'l' + t;
        } catch (e) {}
        return { lists: lists, active: active };
      }

      var state = load();
      var editingId = null;

      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      }

      var tabsEl = document.getElementById('tabs');
      var colsEl = document.getElementById('columns');

      function labelOf(list) { return list.name.trim() || 'Untitled'; }

      function makeRow(list, item, ul) {
        var li = h('li', 'row' + (item.d ? ' done' : ''));

        var box = h('button', 'box');
        box.type = 'button';
        box.setAttribute('role', 'checkbox');
        box.setAttribute('aria-checked', item.d ? 'true' : 'false');
        box.setAttribute('aria-label', 'Done');

        var input = h('input', 'write');
        input.type = 'text';
        input.value = item.t;
        input.autocomplete = 'off';
        input.setAttribute('enterkeyhint', 'next');
        input.setAttribute('aria-label', labelOf(list) + ' item');

        box.addEventListener('click', function () {
          item.d = !item.d;
          box.setAttribute('aria-checked', item.d ? 'true' : 'false');
          li.classList.toggle('done', item.d);
          save();
        });

        input.addEventListener('input', function () {
          item.t = input.value;
          var rows = list.rows;
          if (rows[rows.length - 1] === item && item.t) {
            var extra = blank();
            rows.push(extra);
            ul.appendChild(makeRow(list, extra, ul));
          }
          save();
        });

        input.addEventListener('keydown', function (e) {
          var rows = list.rows;
          var i = rows.indexOf(item);
          if (e.key === 'Enter') {
            e.preventDefault();
            var nextEl = ul.children[i + 1];
            var nextItem = rows[i + 1];
            if (!nextItem || nextItem.t || nextItem.d) {
              var nb = blank();
              rows.splice(i + 1, 0, nb);
              var el = makeRow(list, nb, ul);
              ul.insertBefore(el, nextEl || null);
              nextEl = el;
              save();
            }
            nextEl.querySelector('.write').focus();
          } else if (e.key === 'Backspace' && !input.value && rows.length > MIN_ROWS && i > 0) {
            e.preventDefault();
            var prev = ul.children[i - 1].querySelector('.write');
            rows.splice(i, 1);
            li.remove();
            prev.focus();
            save();
          }
        });

        li.appendChild(box);
        li.appendChild(input);
        return li;
      }

      function makePanel(list) {
        var p = h('div', 'panel');

        var name = h('input', 'name');
        name.type = 'text';
        name.value = list.name;
        name.maxLength = 24;
        name.placeholder = 'List name';
        name.autocomplete = 'off';
        name.setAttribute('aria-label', 'List name');
        name.addEventListener('input', function () {
          list.name = name.value;
          save();
          var label = labelOf(list);
          document.querySelectorAll('.tab[data-id="' + list.id + '"], .chip[data-id="' + list.id + '"]').forEach(function (n) {
            n.textContent = label;
          });
        });
        name.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); editingId = null; render(); }
        });
        p.appendChild(name);

        var sw = h('div', 'swatches');
        sw.setAttribute('role', 'group');
        sw.setAttribute('aria-label', 'Color');
        PALETTE.forEach(function (c, i) {
          var b = h('button', 'sw');
          b.type = 'button';
          b.style.background = c.tab;
          b.dataset.i = String(i);
          b.setAttribute('aria-label', c.n);
          b.setAttribute('aria-pressed', list.color === i ? 'true' : 'false');
          b.addEventListener('click', function () {
            list.color = i;
            save();
            render({ focusSel: '#col-' + list.id + ' .sw[data-i="' + i + '"]' });
          });
          sw.appendChild(b);
        });
        p.appendChild(sw);

        var actions = h('div', 'panel-actions');
        var done = h('button', 'link', 'Done');
        done.type = 'button';
        done.addEventListener('click', function () { editingId = null; render(); });
        actions.appendChild(done);

        if (state.lists.length > 1) {
          var del = h('button', 'link danger', 'Delete list');
          del.type = 'button';
          var armed = false;
          del.addEventListener('click', function () {
            if (!armed) {
              armed = true;
              del.textContent = 'Tap again to delete';
              setTimeout(function () { armed = false; del.textContent = 'Delete list'; }, 4000);
              return;
            }
            var i = state.lists.indexOf(list);
            state.lists.splice(i, 1);
            if (state.active === list.id) state.active = state.lists[Math.max(0, i - 1)].id;
            editingId = null;
            save();
            render();
          });
          actions.appendChild(del);
        }
        p.appendChild(actions);
        return p;
      }

      function toggleEdit(id) {
        editingId = editingId === id ? null : id;
        render(editingId ? { focusSel: '#col-' + id + ' .name', select: true } : null);
      }

      function addList() {
        var used = state.lists.map(function (l) { return l.color % PALETTE.length; });
        var color = -1;
        for (var i = 0; i < PALETTE.length; i++) { if (used.indexOf(i) === -1) { color = i; break; } }
        if (color === -1) color = state.lists.length % PALETTE.length;
        var list = { id: newId(), name: 'New list', color: color, rows: blankRows(START_ROWS) };
        state.lists.push(list);
        state.active = list.id;
        editingId = list.id;
        save();
        render({ focusSel: '#col-' + list.id + ' .name', select: true, reveal: '#col-' + list.id });
      }

      function render(opts) {
        opts = opts || {};
        tabsEl.textContent = '';
        colsEl.textContent = '';

        state.lists.forEach(function (list) {
          var isActive = list.id === state.active;
          var label = labelOf(list);

          var tab = h('button', 'tab', label);
          tab.type = 'button';
          tab.id = 'tab-' + list.id;
          tab.dataset.id = list.id;
          tab.setAttribute('role', 'tab');
          tab.setAttribute('aria-controls', 'col-' + list.id);
          tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
          tab.tabIndex = isActive ? 0 : -1;
          applyColor(tab, list.color);
          tab.addEventListener('click', function () {
            if (state.active === list.id) { toggleEdit(list.id); return; }
            state.active = list.id;
            editingId = null;
            save();
            render();
          });
          tab.addEventListener('keydown', function (e) {
            var i = state.lists.indexOf(list), n = state.lists.length, to = null;
            if (e.key === 'ArrowRight') to = state.lists[(i + 1) % n];
            if (e.key === 'ArrowLeft') to = state.lists[(i + n - 1) % n];
            if (to) {
              e.preventDefault();
              state.active = to.id; editingId = null; save();
              render({ focusSel: '#tab-' + to.id });
            }
          });
          tabsEl.appendChild(tab);

          var col = h('section', 'col' + (isActive ? ' is-active' : ''));
          col.id = 'col-' + list.id;
          col.setAttribute('role', 'tabpanel');
          col.setAttribute('aria-labelledby', 'tab-' + list.id);
          applyColor(col, list.color);

          var head = h('h2', 'col-head');
          var chip = h('button', 'chip', label);
          chip.type = 'button';
          chip.dataset.id = list.id;
          chip.title = 'Rename, recolor or delete this list';
          chip.addEventListener('click', function () { toggleEdit(list.id); });
          head.appendChild(chip);
          col.appendChild(head);

          if (editingId === list.id) col.appendChild(makePanel(list));

          var ul = h('ul', 'list');
          ul.setAttribute('aria-label', label);
          list.rows.forEach(function (item) { ul.appendChild(makeRow(list, item, ul)); });
          col.appendChild(ul);

          var add = h('button', 'add');
          add.type = 'button';
          add.setAttribute('aria-label', 'Add a line to ' + label);
          add.innerHTML = '<span class="add-box" aria-hidden="true"></span><span>Add line</span>';
          add.addEventListener('click', function () {
            var nb = blank();
            list.rows.push(nb);
            var el = makeRow(list, nb, ul);
            ul.appendChild(el);
            save();
            var field = el.querySelector('.write');
            field.focus();
            if (field.scrollIntoView) field.scrollIntoView({ block: 'center', behavior: 'smooth' });
          });
          col.appendChild(add);

          colsEl.appendChild(col);
        });

        var tabAdd = h('button', 'tab-add', '+ New list');
        tabAdd.type = 'button';
        tabAdd.addEventListener('click', addList);
        tabsEl.appendChild(tabAdd);

        var colNew = h('div', 'col-new');
        var chipAdd = h('button', 'chip chip-add', '+ New list');
        chipAdd.type = 'button';
        chipAdd.addEventListener('click', addList);
        colNew.appendChild(chipAdd);
        colsEl.appendChild(colNew);

        if (opts.reveal) {
          var target = document.querySelector(opts.reveal);
          if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }
        if (opts.focusSel) {
          var f = document.querySelector(opts.focusSel);
          if (f) { f.focus(); if (opts.select && f.select) f.select(); }
        }
      }

      render();
    })();
  </script>
</body>
</html>

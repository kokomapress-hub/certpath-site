<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Columns — CertPath Publishing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #FFFFFF;
      --ink: #26354B;
      --ink-soft: #6B7788;
      --line: rgba(38, 53, 75, .16);
      --tab-1: #D3E3CB;   /* sage  */
      --tab-2: #F0E1B8;   /* sand  */
      --tab-3: #CBDDEB;   /* mist  */
      --tab-4: #EDCFC7;   /* blush */
      --tick-1: #9DB593;
      --tick-2: #D3BB7C;
      --tick-3: #8FAAC1;
      --tick-4: #CB9C91;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
    }

    /* Tab bar: phone only */
    .tabs { display: none; }

    .columns {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      min-height: 100vh;
      min-height: 100dvh;
    }
    .col {
      padding: clamp(1rem, 2.5vw, 2rem);
      border-left: 1px solid var(--line);
    }
    .col:first-child { border-left: 0; }
    .col:nth-child(1) { --tab: var(--tab-1); --tick: var(--tick-1); }
    .col:nth-child(2) { --tab: var(--tab-2); --tick: var(--tick-2); }
    .col:nth-child(3) { --tab: var(--tab-3); --tick: var(--tick-3); }
    .col:nth-child(4) { --tab: var(--tab-4); --tick: var(--tick-4); }

    .col-head { margin: 0 0 1rem; }
    .col-head span {
      display: inline-block;
      padding: .4rem .8rem;
      border-radius: 6px;
      background: var(--tab);
      font: 500 .8125rem/1.2 var(--sans);
      color: var(--ink);
    }

    .list { list-style: none; margin: 0; padding: 0; }
    .row { display: flex; align-items: center; gap: .5rem; }

    /* Small square you tick off */
    .box {
      position: relative;
      flex: none;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .box::before {
      content: "";
      position: absolute;
      inset: .4rem;
      border: 2px solid var(--tick);
      border-radius: 2px;
    }
    .box[aria-checked="true"]::before { background: var(--tick); }
    .box[aria-checked="true"]::after {
      content: "";
      position: absolute;
      left: .82rem;
      top: .52rem;
      width: .3rem;
      height: .6rem;
      border: solid var(--ink);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .box:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 4px; }

    /* One line of text */
    .write {
      flex: 1;
      min-width: 0;
      height: 2.5rem;
      padding: 0 0 .1rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 400 1rem/1.5 var(--sans);
      -webkit-appearance: none;
      appearance: none;
    }
    .write:focus-visible { border-bottom-color: var(--ink); }
    .row.done .write { color: var(--ink-soft); text-decoration: line-through; }

    @media (max-width: 860px) and (min-width: 641px) {
      .columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .col { min-height: 50vh; min-height: 50dvh; }
      .col:nth-child(3) { border-left: 0; }
      .col:nth-child(n+3) { border-top: 1px solid var(--line); }
    }

    /* Phone: one list at a time, switched with the colored tabs */
    @media (max-width: 640px) {
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem;
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 1rem 1rem 1.1rem;
        background: var(--bg);
      }
      .tab {
        position: relative;
        padding: .55rem .8rem;
        border: 0;
        border-radius: 6px;
        background: var(--tab);
        color: var(--ink);
        font: 500 .8125rem/1.2 var(--sans);
        cursor: pointer;
        opacity: .6;
        -webkit-tap-highlight-color: transparent;
      }
      .tab:nth-child(1) { --tab: var(--tab-1); }
      .tab:nth-child(2) { --tab: var(--tab-2); }
      .tab:nth-child(3) { --tab: var(--tab-3); }
      .tab:nth-child(4) { --tab: var(--tab-4); }
      .tab[aria-selected="true"] { opacity: 1; }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 0; right: 0; bottom: -.4rem;
        height: 2px;
        background: var(--ink);
      }
      .tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

      .columns { display: block; min-height: 0; }
      .col { display: none; border-left: 0; min-height: calc(100vh - 5rem); min-height: calc(100dvh - 5rem); padding: .25rem 1.25rem 2rem 1rem; }
      .col.is-active { display: block; }
      .col-head { display: none; }
    }
  </style>
</head>
<body>
  <div class="tabs" role="tablist" aria-label="Lists">
    <button class="tab" role="tab" id="tab-1" aria-controls="col-1" aria-selected="true">4 Little Dinos</button>
    <button class="tab" role="tab" id="tab-2" aria-controls="col-2" aria-selected="false" tabindex="-1">Prasad Audio</button>
    <button class="tab" role="tab" id="tab-3" aria-controls="col-3" aria-selected="false" tabindex="-1">CPP</button>
    <button class="tab" role="tab" id="tab-4" aria-controls="col-4" aria-selected="false" tabindex="-1">KDP</button>
  </div>

  <main class="columns">
    <section class="col is-active" id="col-1" role="tabpanel" aria-labelledby="tab-1">
      <h2 class="col-head"><span>4 Little Dinos</span></h2>
      <ul class="list" aria-label="4 Little Dinos"></ul>
    </section>
    <section class="col" id="col-2" role="tabpanel" aria-labelledby="tab-2">
      <h2 class="col-head"><span>Prasad Audio</span></h2>
      <ul class="list" aria-label="Prasad Audio"></ul>
    </section>
    <section class="col" id="col-3" role="tabpanel" aria-labelledby="tab-3">
      <h2 class="col-head"><span>CPP</span></h2>
      <ul class="list" aria-label="CPP"></ul>
    </section>
    <section class="col" id="col-4" role="tabpanel" aria-labelledby="tab-4">
      <h2 class="col-head"><span>KDP</span></h2>
      <ul class="list" aria-label="KDP"></ul>
    </section>
  </main>

  <script>
    // Lists are saved in this browser only; nothing is sent anywhere.
    (function () {
      var KEY = 'certpath-todo-v1';
      var TAB_KEY = 'certpath-todo-tab';
      var LABELS = ['4 Little Dinos', 'Prasad Audio', 'CPP', 'KDP'];
      var START_ROWS = 10;
      var MIN_ROWS = 5;

      function blank() { return { t: '', d: false }; }
      function fresh() {
        var cols = [];
        for (var c = 0; c < 4; c++) {
          var rows = [];
          for (var r = 0; r < START_ROWS; r++) rows.push(blank());
          cols.push(rows);
        }
        return cols;
      }

      var state;
      try {
        state = JSON.parse(localStorage.getItem(KEY));
        if (!Array.isArray(state) || state.length !== 4) state = null;
      } catch (e) { state = null; }
      if (!state) state = fresh();
      state.forEach(function (rows) {
        while (rows.length < START_ROWS) rows.push(blank());
        if (rows[rows.length - 1].t) rows.push(blank());
      });

      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      }

      var lists = Array.prototype.slice.call(document.querySelectorAll('.list'));

      function makeRow(ci, item) {
        var li = document.createElement('li');
        li.className = 'row' + (item.d ? ' done' : '');

        var box = document.createElement('button');
        box.type = 'button';
        box.className = 'box';
        box.setAttribute('role', 'checkbox');
        box.setAttribute('aria-checked', item.d ? 'true' : 'false');
        box.setAttribute('aria-label', 'Done');

        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'write';
        input.value = item.t;
        input.placeholder = '';
        input.autocomplete = 'off';
        input.setAttribute('enterkeyhint', 'next');
        input.setAttribute('aria-label', LABELS[ci] + ' item');

        box.addEventListener('click', function () {
          item.d = !item.d;
          box.setAttribute('aria-checked', item.d ? 'true' : 'false');
          li.classList.toggle('done', item.d);
          save();
        });

        input.addEventListener('input', function () {
          item.t = input.value;
          var rows = state[ci];
          if (rows[rows.length - 1] === item && item.t) {
            var extra = blank();
            rows.push(extra);
            lists[ci].appendChild(makeRow(ci, extra));
          }
          save();
        });

        input.addEventListener('keydown', function (e) {
          var rows = state[ci];
          var i = rows.indexOf(item);
          if (e.key === 'Enter') {
            e.preventDefault();
            var next = lists[ci].children[i + 1];
            if (!next) {
              rows.push(blank());
              lists[ci].appendChild(makeRow(ci, rows[rows.length - 1]));
              next = lists[ci].children[i + 1];
            }
            next.querySelector('.write').focus();
          } else if (e.key === 'Backspace' && !input.value && rows.length > MIN_ROWS && i > 0) {
            e.preventDefault();
            var prev = lists[ci].children[i - 1].querySelector('.write');
            rows.splice(i, 1);
            li.remove();
            prev.focus();
            save();
          }
        });

        li.appendChild(box);
        li.appendChild(input);
        return li;
      }

      lists.forEach(function (ul, ci) {
        state[ci].forEach(function (item) { ul.appendChild(makeRow(ci, item)); });
      });

      // Phone tabs
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
      var cols = Array.prototype.slice.call(document.querySelectorAll('.col'));
      function show(n) {
        tabs.forEach(function (t, i) {
          var on = i === n - 1;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
        });
        cols.forEach(function (c, i) { c.classList.toggle('is-active', i === n - 1); });
        try { localStorage.setItem(TAB_KEY, String(n)); } catch (e) {}
      }
      tabs.forEach(function (t, i) {
        t.addEventListener('click', function () { show(i + 1); });
        t.addEventListener('keydown', function (e) {
          var n = null;
          if (e.key === 'ArrowRight') n = (i + 1) % 4 + 1;
          if (e.key === 'ArrowLeft') n = (i + 3) % 4 + 1;
          if (n) { e.preventDefault(); show(n); tabs[n - 1].focus(); }
        });
      });
      var saved = 1;
      try { saved = parseInt(localStorage.getItem(TAB_KEY), 10) || 1; } catch (e) {}
      if (saved >= 1 && saved <= 4) show(saved);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Columns — CertPath Publishing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #26354B;
      --ink-soft: #6B7788;
      --col-1: #E4ECDF;   /* sage */
      --col-2: #F4EBD3;   /* sand */
      --col-3: #DDE7EF;   /* mist */
      --col-4: #F1E0DB;   /* blush */
      --tick-1: #A9BFA0;
      --tick-2: #D9C48C;
      --tick-3: #9DB6CB;
      --tick-4: #D4A99F;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--col-1);
    }

    /* Tab bar: phone only */
    .tabs { display: none; }

    .columns {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      min-height: 100vh;
      min-height: 100dvh;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: clamp(1.25rem, 3vw, 2.5rem);
    }
    .col:nth-child(1) { background: var(--col-1); --tick: var(--tick-1); }
    .col:nth-child(2) { background: var(--col-2); --tick: var(--tick-2); }
    .col:nth-child(3) { background: var(--col-3); --tick: var(--tick-3); }
    .col:nth-child(4) { background: var(--col-4); --tick: var(--tick-4); }
    .square {
      width: 1.75rem;
      height: 1.75rem;
      background: var(--tick);
      border-radius: 2px;
      flex: none;
    }
    .write {
      width: 100%;
      height: 2.5rem;
      padding: 0 0 .25rem;
      border: 0;
      border-bottom: 1px solid var(--tick);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 400 1rem/1.5 var(--sans);
      -webkit-appearance: none;
      appearance: none;
    }
    .write::placeholder { color: var(--ink-soft); opacity: .7; }
    .write:focus-visible { border-bottom-color: var(--ink); }

    @media (max-width: 860px) and (min-width: 641px) {
      .columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .col { min-height: 50vh; min-height: 50dvh; }
    }

    /* Phone: one column at a time, switched with the four squares */
    @media (max-width: 640px) {
      body { background: var(--page, var(--col-1)); }
      body[data-tab="1"] { --page: var(--col-1); }
      body[data-tab="2"] { --page: var(--col-2); }
      body[data-tab="3"] { --page: var(--col-3); }
      body[data-tab="4"] { --page: var(--col-4); }

      .tabs {
        display: flex;
        gap: 1rem;
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 1rem 1.25rem;
        background: var(--page);
      }
      .tab {
        position: relative;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        border: 0;
        border-radius: 3px;
        background: var(--tick);
        color: var(--ink);
        font: 500 .8125rem/1 var(--sans);
        cursor: pointer;
        opacity: .55;
        -webkit-tap-highlight-color: transparent;
      }
      .tab:nth-child(1) { --tick: var(--tick-1); }
      .tab:nth-child(2) { --tick: var(--tick-2); }
      .tab:nth-child(3) { --tick: var(--tick-3); }
      .tab:nth-child(4) { --tick: var(--tick-4); }
      .tab[aria-selected="true"] { opacity: 1; }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 0; right: 0; bottom: -.5rem;
        height: 2px;
        background: var(--ink);
      }
      .tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

      .columns { display: block; min-height: 0; }
      .col { display: none; min-height: calc(100vh - 4.5rem); min-height: calc(100dvh - 4.5rem); padding-top: .5rem; }
      .col.is-active { display: flex; }
      .col .square { display: none; }
    }
  </style>
</head>
<body data-tab="1">
  <div class="tabs" role="tablist" aria-label="Columns">
    <button class="tab" role="tab" id="tab-1" aria-controls="col-1" aria-selected="true">1</button>
    <button class="tab" role="tab" id="tab-2" aria-controls="col-2" aria-selected="false" tabindex="-1">2</button>
    <button class="tab" role="tab" id="tab-3" aria-controls="col-3" aria-selected="false" tabindex="-1">3</button>
    <button class="tab" role="tab" id="tab-4" aria-controls="col-4" aria-selected="false" tabindex="-1">4</button>
  </div>

  <main class="columns">
    <section class="col is-active" id="col-1" role="tabpanel" aria-labelledby="tab-1">
      <div class="square" aria-hidden="true"></div>
      <input class="write" type="text" id="write-1" aria-label="Column 1 notes" placeholder="Write here" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
    </section>
    <section class="col" id="col-2" role="tabpanel" aria-labelledby="tab-2">
      <div class="square" aria-hidden="true"></div>
      <input class="write" type="text" id="write-2" aria-label="Column 2 notes" placeholder="Write here" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
    </section>
    <section class="col" id="col-3" role="tabpanel" aria-labelledby="tab-3">
      <div class="square" aria-hidden="true"></div>
      <input class="write" type="text" id="write-3" aria-label="Column 3 notes" placeholder="Write here" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
    </section>
    <section class="col" id="col-4" role="tabpanel" aria-labelledby="tab-4">
      <div class="square" aria-hidden="true"></div>
      <input class="write" type="text" id="write-4" aria-label="Column 4 notes" placeholder="Write here" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
    </section>
  </main>

  <script>
    // Text stays in this browser only; nothing is sent anywhere.
    (function () {
      var key = 'certpath-columns-';
      document.querySelectorAll('.write').forEach(function (box) {
        try { box.value = localStorage.getItem(key + box.id) || ''; } catch (e) {}
        box.addEventListener('input', function () {
          try { localStorage.setItem(key + box.id, box.value); } catch (e) {}
        });
      });

      document.querySelectorAll('.write').forEach(function (box) {
        box.addEventListener('keydown', function (e) { if (e.key === 'Enter') box.blur(); });
      });

      // Phone tabs
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
      var cols = Array.prototype.slice.call(document.querySelectorAll('.col'));
      function show(n, focus) {
        tabs.forEach(function (t, i) {
          var on = i === n - 1;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
        });
        cols.forEach(function (c, i) { c.classList.toggle('is-active', i === n - 1); });
        document.body.setAttribute('data-tab', String(n));
        try { localStorage.setItem(key + 'tab', String(n)); } catch (e) {}
        if (focus) cols[n - 1].querySelector('.write').focus();
      }
      tabs.forEach(function (t, i) {
        t.addEventListener('click', function () { show(i + 1, true); });
        t.addEventListener('keydown', function (e) {
          var n = null;
          if (e.key === 'ArrowRight') n = (i + 1) % 4 + 1;
          if (e.key === 'ArrowLeft') n = (i + 3) % 4 + 1;
          if (n) { e.preventDefault(); show(n, false); tabs[n - 1].focus(); }
        });
      });
      var saved = 1;
      try { saved = parseInt(localStorage.getItem(key + 'tab'), 10) || 1; } catch (e) {}
      if (saved >= 1 && saved <= 4) show(saved, false);
    })();
  </script>
</body>
</html>

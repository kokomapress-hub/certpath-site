<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists — CertPath Publishing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #FFFFFF;
      --ink: #26354B;
      --ink-soft: #6B7788;
      --line: rgba(38, 53, 75, .16);
      --line-strong: rgba(38, 53, 75, .35);
      --tab: #D3E3CB;     /* set per list from the palette in the script */
      --tick: #9DB593;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
    }
    button { font-family: inherit; }

    /* Tab bar: real links, one per list. Each list is its own page. */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 1rem clamp(1rem, 4vw, 2rem) 1.1rem;
      background: var(--bg);
    }
    .tab, .tab-add {
      position: relative;
      display: inline-block;
      max-width: 100%;
      padding: .55rem .8rem;
      border-radius: 6px;
      font: 500 .8125rem/1.2 var(--sans);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tab { border: 0; background: var(--tab); color: var(--ink); opacity: .6; }
    .tab:hover { opacity: .85; }
    .tab[aria-current="page"] { opacity: 1; overflow: visible; }
    .tab[aria-current="page"]::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -.4rem;
      height: 2px;
      background: var(--ink);
    }

    /* The list on this page */
    .page {
      max-width: 42rem;
      margin: 0;
      padding: .25rem clamp(1rem, 4vw, 2rem) 3rem;
      min-height: 70vh;
    }
    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 1rem;
    }
    .page-title { margin: 0; min-width: 0; font-size: inherit; font-weight: inherit; }

    .chip {
      display: inline-block;
      max-width: 100%;
      padding: .4rem .8rem;
      border: 0;
      border-radius: 6px;
      background: var(--tab);
      color: var(--ink);
      font: 500 .8125rem/1.2 var(--sans);
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip:focus-visible, .tab:focus-visible, .tab-add:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .chip-add, .tab-add {
      background: transparent;
      border: 1px dashed var(--line-strong);
      color: var(--ink-soft);
    }

    /* Edit panel: name, color, delete */
    .panel {
      display: flex;
      flex-direction: column;
      gap: .9rem;
      margin: 0 0 1rem;
      padding: .9rem;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .name {
      width: 100%;
      height: 2.25rem;
      padding: 0 0 .1rem;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 500 1rem/1.4 var(--sans);
      -webkit-appearance: none;
      appearance: none;
    }
    .name:focus-visible { border-bottom-color: var(--ink); }
    .swatches { display: flex; flex-wrap: wrap; gap: .5rem; }
    .sw {
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sw[aria-pressed="true"] { border-color: var(--ink); }
    .sw:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .panel-actions { display: flex; flex-wrap: wrap; gap: .5rem 1rem; }
    .link {
      padding: .25rem 0;
      border: 0;
      background: none;
      color: var(--ink);
      font: 500 .8125rem/1.2 var(--sans);
      cursor: pointer;
    }
    .link.danger { color: #A33232; }
    .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }

    .list { list-style: none; margin: 0; padding: 0; }
    .row { display: flex; align-items: center; gap: .5rem; }

    /* Small square you tick off */
    .box {
      position: relative;
      flex: none;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .box::before {
      content: "";
      position: absolute;
      inset: .4rem;
      border: 2px solid var(--tick);
      border-radius: 2px;
    }
    .box[aria-checked="true"]::before { background: var(--tick); }
    .box[aria-checked="true"]::after {
      content: "";
      position: absolute;
      left: .82rem;
      top: .52rem;
      width: .3rem;
      height: .6rem;
      border: solid var(--ink);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .box:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 4px; }

    /* One line of text */
    .write {
      flex: 1;
      min-width: 0;
      height: 2.5rem;
      padding: 0 0 .1rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 400 1rem/1.5 var(--sans);
      -webkit-appearance: none;
      appearance: none;
    }
    .write:focus-visible { border-bottom-color: var(--ink); }
    /* Lines are textareas so long text wraps instead of being cut off */
    textarea.write { display: block; height: auto; min-height: 2.5rem; padding: .5rem 0 .4rem; resize: none; overflow: hidden; }
    .row { align-items: flex-start; }
    .row .box { margin-top: .25rem; }
    .row.done .write { color: var(--ink-soft); text-decoration: line-through; }

    /* Always-visible way to add another line */
    .add {
      display: flex;
      align-items: center;
      gap: .5rem;
      width: 100%;
      height: 2.5rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink-soft);
      font: 400 .875rem/1 var(--sans);
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .add-box { position: relative; flex: none; width: 2rem; height: 2rem; }
    .add-box::before {
      content: "+";
      position: absolute;
      inset: .4rem;
      display: grid;
      place-items: center;
      border: 2px dashed var(--tick);
      border-radius: 2px;
      color: var(--ink-soft);
      font: 500 .9rem/1 var(--sans);
    }
    .add:hover { color: var(--ink); }
    .add:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }

  </style>
</head>
<body>
  <nav class="tabs" id="tabs" aria-label="Lists"></nav>
  <main class="page" id="page"></main>
  <script>
    // Every list is its own page: /columns?list=<name>. Everything is saved in
    // this browser only; nothing is sent anywhere.
    (function () {
      var KEY = 'certpath-todo-v2';
      var OLD_KEY = 'certpath-todo-v1';
      var OLD_TAB_KEY = 'certpath-todo-tab';
      var START_ROWS = 10;
      var MIN_ROWS = 5;

      // Mild colors: tab/chip color and the darker tick-square color
      var PALETTE = [
        { n: 'Sage',     tab: '#D3E3CB', tick: '#9DB593' },
        { n: 'Sand',     tab: '#F0E1B8', tick: '#D3BB7C' },
        { n: 'Mist',     tab: '#CBDDEB', tick: '#8FAAC1' },
        { n: 'Blush',    tab: '#EDCFC7', tick: '#CB9C91' },
        { n: 'Lavender', tab: '#DDD5EC', tick: '#A99BC9' },
        { n: 'Aqua',     tab: '#C6E6E0', tick: '#86BAB0' },
        { n: 'Peach',    tab: '#F6DCC3', tick: '#DEAA80' },
        { n: 'Lime',     tab: '#E1EBBE', tick: '#B2C36A' },
        { n: 'Rose',     tab: '#F0D0DD', tick: '#CD91AB' },
        { n: 'Slate',    tab: '#D6DCE4', tick: '#9AA7B7' }
      ];
      var DEFAULT_NAMES = ['4 Little Dinos', 'Prasad Audio', 'CPP', 'KDP'];
      // Readable page addresses for the first four lists
      var DEFAULT_SLUGS = { l1: 'dinos', l2: 'audio', l3: 'cpp', l4: 'kdp', l25books: 'books' };

      function blank() { return { t: '', d: false }; }
      function blankRows(n) { var r = []; for (var i = 0; i < n; i++) r.push(blank()); return r; }
      function newId() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
      function slugOf(list) { return DEFAULT_SLUGS[list.id] || list.id; }
      function hrefOf(list, edit) { return '?list=' + encodeURIComponent(slugOf(list)) + (edit ? '&edit=1' : ''); }
      function h(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }
      function applyColor(node, idx) {
        var c = PALETTE[idx % PALETTE.length];
        node.style.setProperty('--tab', c.tab);
        node.style.setProperty('--tick', c.tick);
      }
      function cleanRows(rows) {
        var out = [];
        (Array.isArray(rows) ? rows : []).forEach(function (r) {
          if (r && typeof r === 'object') out.push({ t: String(r.t || ''), d: !!r.d });
        });
        while (out.length < START_ROWS) out.push(blank());
        if (out[out.length - 1].t) out.push(blank());
        return out;
      }

      function load() {
        try {
          var v2 = JSON.parse(localStorage.getItem(KEY));
          if (v2 && Array.isArray(v2.lists) && v2.lists.length) {
            v2.lists.forEach(function (l) {
              l.rows = cleanRows(l.rows);
              if (typeof l.color !== 'number') l.color = 0;
              if (typeof l.name !== 'string') l.name = '';
            });
            if (!v2.lists.some(function (l) { return l.id === v2.active; })) v2.active = v2.lists[0].id;
            return v2;
          }
        } catch (e) {}
        // First run: bring over the four original lists and their items
        var lists = DEFAULT_NAMES.map(function (name, i) {
          return { id: 'l' + (i + 1), name: name, color: i, rows: blankRows(START_ROWS) };
        });
        try {
          var v1 = JSON.parse(localStorage.getItem(OLD_KEY));
          if (Array.isArray(v1) && v1.length === 4) v1.forEach(function (rows, i) { lists[i].rows = cleanRows(rows); });
        } catch (e) {}
        var active = 'l1';
        try {
          var t = parseInt(localStorage.getItem(OLD_TAB_KEY), 10);
          if (t >= 1 && t <= 4) active = 'l' + t;
        } catch (e) {}
        return { lists: lists, active: active };
      }

      function write(s) {
        try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
      }
      function find(s, id) {
        for (var i = 0; i < s.lists.length; i++) if (s.lists[i].id === id) return s.lists[i];
        return null;
      }

      var state = load();
      // "25 New Books": what is still pending (from Top25_Tracker.md). Added once as its own list;
      // bump SEED_VERSION to add new lines later (ticked or edited lines are never touched).
      var SEED_KEY = 'certpath-todo-seed-25';
      var SEED_ID = 'l25books';
      var SEED_VERSION = 1;
      var SEED = [
        'FE Guide: publish paperback',
        'FE Guide: hardcover (ISBN + upload)',
        'FE Guide: Kindle EPUB upload',
        'FE Exams: publish paperback',
        'FE Exams: hardcover (ISBN + upload)',
        'FE Exams: Kindle Create replica',
        'FE A+: finish Exams 3-4, upload',
        'FE site: add Amazon links',
        'NGAT Gr 2: upload to KDP',
        'NGAT K/1: Gemini audit, upload',
        'NGAT Gr 3: Gemini confirm, upload',
        'NGAT K/1 + Gr 3: upload A+',
        'CogAT Grade 2: build',
        'CogAT K/1: build',
        'NNAT Grade 2: build',
        'Nursing Dosage Calc: audit',
        'HESI A2 Math: audit',
        'TEAS 7 Math: audit',
        'ASVAB Math Workbook: audit',
        'ASVAB Math Tests: audit',
        'ISEE Middle Math: start',
        'SSAT Middle Math: start',
        'SHSAT Math: start',
        '6th Grade Math: start',
        '7th Grade Math: start',
        '8th Grade / Pre-Algebra: start',
        'HS Reading Comprehension: start',
        'FE Mechanical: start',
        'FE Electrical: build content',
        'CDL Study Guide: research',
        'FAA A&P General: research',
        'Claude for Solo Publishers: research'
      ];
      (function seed() {
        var v = 0;
        try { v = parseInt(localStorage.getItem(SEED_KEY), 10) || 0; } catch (e) {}
        if (v >= SEED_VERSION) return;
        var list = null;
        state.lists.forEach(function (l) { if (l.id === SEED_ID) list = l; });
        if (!list) {
          list = { id: SEED_ID, name: '25 New Books', color: 4, rows: [] };
          state.lists.push(list);
        }
        var kept = list.rows.filter(function (r) { return r.t || r.d; });
        var have = {};
        kept.forEach(function (r) { have[r.t] = true; });
        SEED.forEach(function (t) { if (!have[t]) kept.push({ t: t, d: false }); });
        list.rows = cleanRows(kept);
        try { localStorage.setItem(SEED_KEY, String(SEED_VERSION)); } catch (e) {}
        write(state);
      })();
      var params = new URLSearchParams(location.search);
      var want = params.get('list');
      var cur = null;
      state.lists.forEach(function (l) { if (slugOf(l) === want || l.id === want) cur = l; });

      if (!cur) {
        // No (or unknown) list in the address: go to the last one opened
        var back = find(state, state.active) || state.lists[0];
        location.replace(location.pathname + hrefOf(back));
        return;
      }

      var editing = params.get('edit') === '1';
      if (editing && window.history && history.replaceState) {
        history.replaceState(null, '', location.pathname + hrefOf(cur));
      }

      // Save only this page's list into the freshest stored copy, so other
      // pages open at the same time never overwrite each other.
      function save() {
        var fresh = load();
        var mine = find(fresh, cur.id);
        if (mine) { mine.name = cur.name; mine.color = cur.color; mine.rows = cur.rows; }
        fresh.active = cur.id;
        write(fresh);
      }
      save();

      var tabsEl = document.getElementById('tabs');
      var pageEl = document.getElementById('page');

      function labelOf(list) { return list.name.trim() || 'Untitled'; }

      function fit(el) {
        if (!el.offsetParent) return;
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
      }
      function fitAll() { Array.prototype.forEach.call(document.querySelectorAll('textarea.write'), fit); }
      window.addEventListener('resize', fitAll);

      function makeRow(list, item, ul) {
        var li = h('li', 'row' + (item.d ? ' done' : ''));

        var box = h('button', 'box');
        box.type = 'button';
        box.setAttribute('role', 'checkbox');
        box.setAttribute('aria-checked', item.d ? 'true' : 'false');
        box.setAttribute('aria-label', 'Done');

        var input = h('textarea', 'write');
        input.rows = 1;
        input.value = item.t;
        input.autocomplete = 'off';
        input.setAttribute('enterkeyhint', 'next');
        input.setAttribute('aria-label', labelOf(list) + ' item');
        input.title = item.t;

        box.addEventListener('click', function () {
          item.d = !item.d;
          box.setAttribute('aria-checked', item.d ? 'true' : 'false');
          li.classList.toggle('done', item.d);
          save();
        });

        input.addEventListener('input', function () {
          if (input.value.indexOf('\n') !== -1) input.value = input.value.replace(/\n/g, ' ');
          fit(input);
          item.t = input.value;
          input.title = item.t;
          var rows = list.rows;
          if (rows[rows.length - 1] === item && item.t) {
            var extra = blank();
            rows.push(extra);
            ul.appendChild(makeRow(list, extra, ul));
          }
          save();
        });

        input.addEventListener('keydown', function (e) {
          var rows = list.rows;
          var i = rows.indexOf(item);
          if (e.key === 'Enter') {
            e.preventDefault();
            var nextEl = ul.children[i + 1];
            var nextItem = rows[i + 1];
            if (!nextItem || nextItem.t || nextItem.d) {
              var nb = blank();
              rows.splice(i + 1, 0, nb);
              var el = makeRow(list, nb, ul);
              ul.insertBefore(el, nextEl || null);
              nextEl = el;
              save();
            }
            nextEl.querySelector('.write').focus();
          } else if (e.key === 'Backspace' && !input.value && rows.length > MIN_ROWS && i > 0) {
            e.preventDefault();
            var prev = ul.children[i - 1].querySelector('.write');
            rows.splice(i, 1);
            li.remove();
            prev.focus();
            save();
          }
        });

        li.appendChild(box);
        li.appendChild(input);
        requestAnimationFrame(function () { fit(input); });
        return li;
      }

      function makePanel(list) {
        var p = h('div', 'panel');

        var name = h('input', 'name');
        name.type = 'text';
        name.value = list.name;
        name.maxLength = 24;
        name.placeholder = 'List name';
        name.autocomplete = 'off';
        name.setAttribute('aria-label', 'List name');
        name.addEventListener('input', function () {
          list.name = name.value;
          save();
          var label = labelOf(list);
          document.title = label + ' — CertPath';
          var t = tabsEl.querySelector('.tab[data-id="' + list.id + '"]');
          if (t) t.textContent = label;
          var c = pageEl.querySelector('.chip');
          if (c) c.textContent = label;
        });
        name.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); editing = false; render(); }
        });
        p.appendChild(name);

        var sw = h('div', 'swatches');
        sw.setAttribute('role', 'group');
        sw.setAttribute('aria-label', 'Color');
        PALETTE.forEach(function (c, i) {
          var b = h('button', 'sw');
          b.type = 'button';
          b.style.background = c.tab;
          b.dataset.i = String(i);
          b.setAttribute('aria-label', c.n);
          b.setAttribute('aria-pressed', list.color === i ? 'true' : 'false');
          b.addEventListener('click', function () {
            list.color = i;
            save();
            render({ focusSel: '.sw[data-i="' + i + '"]' });
          });
          sw.appendChild(b);
        });
        p.appendChild(sw);

        var actions = h('div', 'panel-actions');
        var done = h('button', 'link', 'Done');
        done.type = 'button';
        done.addEventListener('click', function () { editing = false; render(); });
        actions.appendChild(done);

        if (state.lists.length > 1) {
          var del = h('button', 'link danger', 'Delete list');
          del.type = 'button';
          var armed = false;
          del.addEventListener('click', function () {
            if (!armed) {
              armed = true;
              del.textContent = 'Tap again to delete';
              setTimeout(function () { armed = false; del.textContent = 'Delete list'; }, 4000);
              return;
            }
            var fresh = load();
            var i = -1;
            fresh.lists.forEach(function (l, n) { if (l.id === list.id) i = n; });
            if (i > -1 && fresh.lists.length > 1) fresh.lists.splice(i, 1);
            var next = fresh.lists[Math.max(0, i - 1)];
            fresh.active = next.id;
            write(fresh);
            location.replace(location.pathname + hrefOf(next));
          });
          actions.appendChild(del);
        }
        p.appendChild(actions);
        return p;
      }

      function addList() {
        var fresh = load();
        var used = fresh.lists.map(function (l) { return l.color % PALETTE.length; });
        var color = -1;
        for (var i = 0; i < PALETTE.length; i++) { if (used.indexOf(i) === -1) { color = i; break; } }
        if (color === -1) color = fresh.lists.length % PALETTE.length;
        var list = { id: newId(), name: 'New list', color: color, rows: blankRows(START_ROWS) };
        fresh.lists.push(list);
        fresh.active = list.id;
        write(fresh);
        location.href = location.pathname + hrefOf(list, true);
      }

      function render(opts) {
        opts = opts || {};
        tabsEl.textContent = '';
        pageEl.textContent = '';
        var label = labelOf(cur);
        document.title = label + ' — CertPath';

        state.lists.forEach(function (list) {
          var isCur = list.id === cur.id;
          var tab = h('a', 'tab', isCur ? label : labelOf(list));
          tab.href = hrefOf(list);
          tab.dataset.id = list.id;
          if (isCur) tab.setAttribute('aria-current', 'page');
          applyColor(tab, isCur ? cur.color : list.color);
          tabsEl.appendChild(tab);
        });

        var tabAdd = h('button', 'tab-add', '+ New list');
        tabAdd.type = 'button';
        tabAdd.addEventListener('click', addList);
        tabsEl.appendChild(tabAdd);

        applyColor(pageEl, cur.color);

        var head = h('div', 'page-head');
        var title = h('h1', 'page-title');
        var chip = h('button', 'chip', label);
        chip.type = 'button';
        chip.title = 'Rename, recolor or delete this list';
        chip.addEventListener('click', function () {
          editing = !editing;
          render(editing ? { focusSel: '.name', select: true } : null);
        });
        title.appendChild(chip);
        head.appendChild(title);
        var edit = h('button', 'link', editing ? 'Close' : 'Edit list');
        edit.type = 'button';
        edit.addEventListener('click', function () { chip.click(); });
        head.appendChild(edit);
        pageEl.appendChild(head);

        if (editing) pageEl.appendChild(makePanel(cur));

        var ul = h('ul', 'list');
        ul.setAttribute('aria-label', label);
        cur.rows.forEach(function (item) { ul.appendChild(makeRow(cur, item, ul)); });
        pageEl.appendChild(ul);

        var add = h('button', 'add');
        add.type = 'button';
        add.setAttribute('aria-label', 'Add a line to ' + label);
        add.innerHTML = '<span class="add-box" aria-hidden="true"></span><span>Add line</span>';
        add.addEventListener('click', function () {
          var nb = blank();
          cur.rows.push(nb);
          var el = makeRow(cur, nb, ul);
          ul.appendChild(el);
          save();
          var field = el.querySelector('.write');
          field.focus();
          if (field.scrollIntoView) field.scrollIntoView({ block: 'center', behavior: 'smooth' });
        });
        pageEl.appendChild(add);

        requestAnimationFrame(fitAll);
        if (opts.focusSel) {
          var f = document.querySelector(opts.focusSel);
          if (f) { f.focus(); if (opts.select && f.select) f.select(); }
        }
      }

      // Coming back with the Back button: reload so this page shows what is saved now
      window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });

      render(editing ? { focusSel: '.name', select: true } : null);
    })();
  </script>
</body>
</html>

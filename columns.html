<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Four Columns — CertPath Publishing</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #FFFFFF;
      --ink: #26354B;
      --ink-soft: #6B7788;
      --line: rgba(38, 53, 75, .16);
      --line-strong: rgba(38, 53, 75, .35);
      --tab: #D3E3CB;     /* set per list from the palette in the script */
      --tick: #9DB593;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
    }
    button { font-family: inherit; }

    /* Tab bar: phone only */
    .tabs { display: none; }

    /* Desktop: lists side by side, scrolls sideways when there are many */
    .columns {
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .col {
      flex: 1 0 16rem;
      min-width: 16rem;
      padding: clamp(1rem, 2.5vw, 2rem);
      border-right: 1px solid var(--line);
    }
    .col-new {
      flex: 0 0 auto;
      padding: clamp(1rem, 2.5vw, 2rem);
    }

    .col-head { margin: 0 0 1rem; display: flex; align-items: center; gap: .4rem; }
    .head-del, .del-row {
      flex: 0 0 auto; border: 0; background: transparent; color: var(--ink-soft);
      cursor: pointer; padding: .25rem; border-radius: 4px; line-height: 0;
    }
    .head-del svg, .del-row svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .del-row { opacity: .35; }
    .row:hover .del-row, .del-row:focus-visible { opacity: 1; }
    .head-del:hover, .del-row:hover { color: #A33232; }
    .head-del:focus-visible, .del-row:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    @media (hover: none) { .del-row { opacity: .6; } }
    .chip {
      display: inline-block;
      max-width: 100%;
      padding: .4rem .8rem;
      border: 0;
      border-radius: 6px;
      background: var(--tab);
      color: var(--ink);
      font: 500 .8125rem/1.2 var(--sans);
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip:focus-visible, .tab:focus-visible, .tab-add:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .chip-add, .tab-add {
      background: transparent;
      border: 1px dashed var(--line-strong);
      color: var(--ink-soft);
    }

    /* Edit panel: name, color, delete */
    .panel {
      display: flex;
      flex-direction: column;
      gap: .9rem;
      margin: 0 0 1rem;
      padding: .9rem;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .name {
      width: 100%;
      height: 2.25rem;
      padding: 0 0 .1rem;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 500 1rem/1.4 var(--sans);
      -webkit-appearance: none;
      appearance: none;
    }
    .name:focus-visible { border-bottom-color: var(--ink); }
    .swatches { display: flex; flex-wrap: wrap; gap: .5rem; }
    .sw {
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .sw[aria-pressed="true"] { border-color: var(--ink); }
    .sw:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .panel-actions { display: flex; flex-wrap: wrap; gap: .5rem 1rem; }
    .link {
      padding: .25rem 0;
      border: 0;
      background: none;
      color: var(--ink);
      font: 500 .8125rem/1.2 var(--sans);
      cursor: pointer;
    }
    .link.danger { color: #A33232; }
    .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }

    .list { list-style: none; margin: 0; padding: 0; }
    .row { display: flex; align-items: center; gap: .5rem; }
    .row[data-lvl="1"] { margin-left: 1.1rem; }
    .row[data-lvl="2"] { margin-left: 2.2rem; }
    .row[data-lvl="1"] .box, .row[data-lvl="2"] .box { transform: scale(.85); }

    /* Small square you tick off */
    .box {
      position: relative;
      flex: none;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .box::before {
      content: "";
      position: absolute;
      inset: .4rem;
      border: 2px solid var(--tick);
      border-radius: 2px;
    }
    .box[aria-checked="true"]::before { background: var(--tick); }
    .box[aria-checked="true"]::after {
      content: "";
      position: absolute;
      left: .82rem;
      top: .52rem;
      width: .3rem;
      height: .6rem;
      border: solid var(--ink);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .box:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 4px; }

    /* One line of text */
    .write {
      flex: 1;
      min-width: 0;
      height: 2.5rem;
      padding: 0 0 .1rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: 400 1rem/1.5 var(--sans);
      -webkit-appearance: none;
      appearance: none;
    }
    .write:focus-visible { border-bottom-color: var(--ink); }
    /* Lines are textareas so long text wraps instead of being cut off */
    textarea.write { display: block; height: auto; min-height: 2.5rem; padding: .5rem 0 .4rem; resize: none; overflow: hidden; }
    .row { align-items: flex-start; }
    .row .box { margin-top: .25rem; }

    /* Star: click to highlight the task */
    .star {
      flex: none;
      width: 2rem;
      height: 2rem;
      margin-top: .25rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink-soft);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .star svg { display: block; width: 1.25rem; height: 1.25rem; margin: auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; opacity: .55; }
    .star:hover svg { opacity: 1; }
    .star[aria-pressed="true"] { color: #C88F00; }
    .star[aria-pressed="true"] svg { fill: #F2BE2E; stroke: #C88F00; opacity: 1; }
    .star:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 4px; }
    .row.starred { background: #FFF3C4; border-radius: 6px; }
    .row.starred .write { border-bottom-color: transparent; }

    /* Handle: drag to move a task, tap for move/insert options */
    .row { flex-wrap: wrap; }
    .row > .write { flex: 1 1 0; }
    .grip {
      flex: none;
      width: 2rem;
      height: 2rem;
      margin-top: .25rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink-soft);
      cursor: grab;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .grip svg { display: block; width: 1rem; height: 1rem; margin: auto; fill: currentColor; opacity: .45; }
    .grip:hover svg, .grip[aria-expanded="true"] svg { opacity: 1; }
    .grip:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 4px; }
    .row.dragging { background: #F4F6F9; border-radius: 6px; box-shadow: 0 2px 10px rgba(38, 53, 75, .18); position: relative; z-index: 2; }
    .row.dragging .grip { cursor: grabbing; }
    body.is-dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }
    .row-menu {
      flex: 0 0 100%;
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      padding: .4rem 0 .6rem 2.5rem;
    }
    .row-menu button {
      padding: .4rem .65rem;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #FFFFFF;
      color: var(--ink);
      font: 500 .75rem/1.2 var(--sans);
      cursor: pointer;
    }
    .row-menu button:hover { border-color: var(--ink); }
    .row-menu button.danger { color: #A33232; }
    .row-menu button:disabled { opacity: .4; cursor: default; }
    .row.done .write { color: var(--ink-soft); text-decoration: line-through; }

    /* Always-visible way to add another line */
    .add {
      display: flex;
      align-items: center;
      gap: .5rem;
      width: 100%;
      height: 2.5rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink-soft);
      font: 400 .875rem/1 var(--sans);
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .add-box { position: relative; flex: none; width: 2rem; height: 2rem; }
    .add-box::before {
      content: "+";
      position: absolute;
      inset: .4rem;
      display: grid;
      place-items: center;
      border: 2px dashed var(--tick);
      border-radius: 2px;
      color: var(--ink-soft);
      font: 500 .9rem/1 var(--sans);
    }
    .add:hover { color: var(--ink); }
    .add:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }

    /* Phone: one list at a time, switched with the colored tabs */
    /* Master Taskbar: starred tasks from every list, pinned on the left */
    .master {
      flex: 0 0 15rem; min-width: 15rem;
      padding: clamp(1rem, 2.5vw, 2rem) 1rem;
      border-right: 2px solid var(--line-strong);
      background: #FBF6E4;
      position: sticky; left: 0; z-index: 2;
      align-self: stretch;
    }
    .master h2 { margin: 0 0 1rem; font-size: 1rem; display: flex; align-items: center; gap: .4rem; }
    .master h2 svg { width: 1rem; height: 1rem; fill: #E0A800; }
    .master ul { list-style: none; margin: 0; padding: 0; }
    .master li { display: flex; align-items: flex-start; gap: .35rem; padding: .4rem 0; border-bottom: 1px solid var(--line); }
    .master .m-go { flex: 1; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); font: 400 .95rem/1.35 var(--sans); }
    .master .m-go small { display: block; color: var(--ink-soft); font-size: .72rem; }
    .master li.done .m-go span { text-decoration: line-through; color: var(--ink-soft); }
    .master .m-un { background: none; border: 0; cursor: pointer; padding: .1rem; }
    .master .m-un svg { width: 1rem; height: 1rem; fill: #E0A800; }
    .master .m-un:hover svg { fill: none; stroke: #E0A800; stroke-width: 2; }
    .master .m-empty { color: var(--ink-soft); font-size: .85rem; margin: 0; }
    @media (max-width: 640px) {
      .master { position: static; flex-basis: auto; min-width: 0; border-right: 0; border-bottom: 2px solid var(--line-strong); }
    }
    @media (max-width: 640px) {
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: .5rem;
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 1rem 1rem 1.1rem;
        background: var(--bg);
      }
      .tab, .tab-add {
        position: relative;
        max-width: 100%;
        padding: .55rem .8rem;
        border-radius: 6px;
        font: 500 .8125rem/1.2 var(--sans);
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
      }
      .tab {
        border: 0;
        background: var(--tab);
        color: var(--ink);
        opacity: .6;
      }
      .tab[aria-selected="true"] { opacity: 1; overflow: visible; }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 0; right: 0; bottom: -.4rem;
        height: 2px;
        background: var(--ink);
      }

      .columns { display: block; overflow: visible; min-height: 0; }
      .col {
        display: none;
        min-width: 0;
        border-right: 0;
        min-height: calc(100vh - 5rem);
        min-height: calc(100dvh - 5rem);
        padding: .25rem 1.25rem 2rem 1rem;
      }
      .col.is-active { display: block; }
      .col-head { display: none; }
      .col-new { display: none; }
    }
    /* Small "Saved" note */
    .saved {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 5;
      padding: .35rem .7rem;
      border-radius: 6px;
      background: #26354B;
      color: #FFFFFF;
      font: 500 .75rem/1.2 var(--sans);
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .saved.on { opacity: .85; }
    .saved.bad { background: #A33232; opacity: 1; }
    /* Sync button and panel */
    .sync {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 4;
      padding: .35rem .7rem;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #FFFFFF;
      color: var(--ink-soft);
      font: 500 .75rem/1.2 var(--sans);
      cursor: pointer;
    }
    .sync.is-ok { color: #3E7A43; border-color: #9DC4A0; }
    .sync.is-error, .sync.is-wrong, .sync.is-short { color: #A33232; border-color: #E0AFAF; }
    .sync-panel {
      position: fixed;
      left: 1rem;
      right: 1rem;
      bottom: 3.4rem;
      z-index: 6;
      max-width: 22rem;
      display: flex;
      flex-direction: column;
      gap: .7rem;
      padding: .9rem;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #FFFFFF;
      box-shadow: 0 6px 24px rgba(38, 53, 75, .15);
      font: 400 .8125rem/1.45 var(--sans);
    }
    .sync-panel p { margin: 0; color: var(--ink-soft); }
    .sync-panel .pass {
      height: 2.25rem;
      padding: 0 .6rem;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      font: 400 1rem/1 var(--sans);
      color: var(--ink);
    }
    .sync-actions { display: flex; flex-wrap: wrap; gap: .5rem 1rem; }
    .list:last-of-type { padding-bottom: 0; }
    .add { margin-bottom: 3rem; }
  </style>
</head>
<body>
  <div class="tabs" id="tabs" role="tablist" aria-label="Lists"></div>
  <main class="columns" id="columns"></main>

  <script>
    // Everything is saved in this browser only; nothing is sent anywhere.
    (function () {
      var KEY = 'certpath-todo-v2';
      var OLD_KEY = 'certpath-todo-v1';
      var OLD_TAB_KEY = 'certpath-todo-tab';
      var START_ROWS = 10;
      var MIN_ROWS = 5;

      // Mild colors: tab/chip color and the darker tick-square color
      var PALETTE = [
        { n: 'Sage',     tab: '#D3E3CB', tick: '#9DB593' },
        { n: 'Sand',     tab: '#F0E1B8', tick: '#D3BB7C' },
        { n: 'Mist',     tab: '#CBDDEB', tick: '#8FAAC1' },
        { n: 'Blush',    tab: '#EDCFC7', tick: '#CB9C91' },
        { n: 'Lavender', tab: '#DDD5EC', tick: '#A99BC9' },
        { n: 'Aqua',     tab: '#C6E6E0', tick: '#86BAB0' },
        { n: 'Peach',    tab: '#F6DCC3', tick: '#DEAA80' },
        { n: 'Lime',     tab: '#E1EBBE', tick: '#B2C36A' },
        { n: 'Rose',     tab: '#F0D0DD', tick: '#CD91AB' },
        { n: 'Slate',    tab: '#D6DCE4', tick: '#9AA7B7' }
      ];
      var DEFAULT_NAMES = ['4 Little Dinos', 'Prasad Audio', 'CPP', 'KDP'];

      function blank() { return { t: '', d: false, s: false }; }
      function blankRows(n) { var r = []; for (var i = 0; i < n; i++) r.push(blank()); return r; }
      function newId() { return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
      function h(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }
      function applyColor(node, idx) {
        var c = PALETTE[idx % PALETTE.length];
        node.style.setProperty('--tab', c.tab);
        node.style.setProperty('--tick', c.tick);
      }
      function cleanRows(rows) {
        var out = [];
        (Array.isArray(rows) ? rows : []).forEach(function (r) {
          if (r && typeof r === 'object') out.push(withLevel({ t: String(r.t || ''), d: !!r.d, s: !!r.s }, r.i));
        });
        while (out.length < START_ROWS) out.push(blank());
        if (out[out.length - 1].t) out.push(blank());
        return out;
      }

      // Sub-task depth: 0 = main task, 1-2 = sub-task levels (stored as `i`, left out when 0)
      var MAX_LEVEL = 2;
      function levelOf(r) { return Math.max(0, Math.min(MAX_LEVEL, (r && r.i) | 0)); }
      function withLevel(r, lvl) { lvl = levelOf({ i: lvl }); if (lvl) r.i = lvl; else delete r.i; return r; }

      function load() {
        try {
          var v2 = JSON.parse(localStorage.getItem(KEY));
          if (v2 && Array.isArray(v2.lists) && v2.lists.length) {
            v2.lists.forEach(function (l) {
              l.rows = cleanRows(l.rows);
              if (typeof l.color !== 'number') l.color = 0;
              if (typeof l.name !== 'string') l.name = '';
            });
            if (!v2.lists.some(function (l) { return l.id === v2.active; })) v2.active = v2.lists[0].id;
            return v2;
          }
        } catch (e) {}
        // First run on the new version: bring over the four original lists and their items
        var lists = DEFAULT_NAMES.map(function (name, i) {
          return { id: 'l' + (i + 1), name: name, color: i, rows: blankRows(START_ROWS) };
        });
        try {
          var v1 = JSON.parse(localStorage.getItem(OLD_KEY));
          if (Array.isArray(v1) && v1.length === 4) v1.forEach(function (rows, i) { lists[i].rows = cleanRows(rows); });
        } catch (e) {}
        var active = 'l1';
        try {
          var t = parseInt(localStorage.getItem(OLD_TAB_KEY), 10);
          if (t >= 1 && t <= 4) active = 'l' + t;
        } catch (e) {}
        return { lists: lists, active: active };
      }

      var state = load();

      // "25 New Books": what is still pending (from Top25_Tracker.md). Added once as its own list;
      // bump SEED_VERSION to add new lines later (ticked or edited lines are never touched).
      var SEED_KEY = 'certpath-todo-seed-25';
      var SEED_ID = 'l25books';
      var SEED_VERSION = 1;
      var SEED = [
        'FE Guide: publish paperback',
        'FE Guide: hardcover (ISBN + upload)',
        'FE Guide: Kindle EPUB upload',
        'FE Exams: publish paperback',
        'FE Exams: hardcover (ISBN + upload)',
        'FE Exams: Kindle Create replica',
        'FE A+: finish Exams 3-4, upload',
        'FE site: add Amazon links',
        'NGAT Gr 2: upload to KDP',
        'NGAT K/1: Gemini audit, upload',
        'NGAT Gr 3: Gemini confirm, upload',
        'NGAT K/1 + Gr 3: upload A+',
        'CogAT Grade 2: build',
        'CogAT K/1: build',
        'NNAT Grade 2: build',
        'Nursing Dosage Calc: audit',
        'HESI A2 Math: audit',
        'TEAS 7 Math: audit',
        'ASVAB Math Workbook: audit',
        'ASVAB Math Tests: audit',
        'ISEE Middle Math: start',
        'SSAT Middle Math: start',
        'SHSAT Math: start',
        '6th Grade Math: start',
        '7th Grade Math: start',
        '8th Grade / Pre-Algebra: start',
        'HS Reading Comprehension: start',
        'FE Mechanical: start',
        'FE Electrical: build content',
        'CDL Study Guide: research',
        'FAA A&P General: research',
        'Claude for Solo Publishers: research'
      ];
      (function seed() {
        var v = 0;
        try { v = parseInt(localStorage.getItem(SEED_KEY), 10) || 0; } catch (e) {}
        if (v >= SEED_VERSION) return;
        var list = null;
        state.lists.forEach(function (l) { if (l.id === SEED_ID) list = l; });
        if (!list) {
          list = { id: SEED_ID, name: '25 New Books', color: 4, rows: [] };
          state.lists.push(list);
        }
        var kept = list.rows.filter(function (r) { return r.t || r.d || r.s; });
        var have = {};
        kept.forEach(function (r) { have[r.t] = true; });
        SEED.forEach(function (t) { if (!have[t]) kept.push({ t: t, d: false }); });
        list.rows = cleanRows(kept);
        try { localStorage.setItem(SEED_KEY, String(SEED_VERSION)); } catch (e) {}
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      })();
      var editingId = null;

      // Saved on every keystroke, tick and star; the note at the bottom confirms it.
      var statusEl = null, statusTimer = null;
      function showStatus(ok) {
        if (!statusEl) {
          statusEl = h('div', 'saved');
          statusEl.setAttribute('role', 'status');
          statusEl.setAttribute('aria-live', 'polite');
          document.body.appendChild(statusEl);
        }
        statusEl.textContent = ok ? 'Saved' : 'Not saved \u2014 this browser is blocking storage';
        statusEl.classList.toggle('bad', !ok);
        statusEl.classList.add('on');
        clearTimeout(statusTimer);
        if (ok) statusTimer = setTimeout(function () { statusEl.classList.remove('on'); }, 1200);
      }
      // If another tab saved in the meantime, keep its lists and replace only the one being edited here
      function mergeFresh() {
        if (!pendingSync) return;
        var a = document.activeElement;
        var col = a && a.closest ? a.closest('.col') : null;
        var id = col ? col.id.replace(/^col-/, '') : state.active;
        var mine = null;
        state.lists.forEach(function (l) { if (l.id === id) mine = l; });
        var fresh = load();
        if (mine) {
          var found = false;

      function makeRow(list, item, ul) {

        li.appendChild(box);
        li.appendChild(star);
        li.appendChild(input);
        li.appendChild(del);
        li.appendChild(grip);

        var drag = null;

      // Put the saved order in line with what is on screen, and keep one blank line at the end
      function syncOrder(list, ul) {
        var order = [];
        var prevLvl = -1;
        Array.prototype.forEach.call(ul.children, function (el) {
          if (!el._item) return;
          // a sub-task can only sit one level under the row above it (fixes rows moved to the top etc.)
          var lvl = Math.min(levelOf(el._item), prevLvl + 1);
          withLevel(el._item, lvl);

          prevLvl = lvl;

        });

        var last = order[order.length - 1];

      }

      function lvlEl(el) { return el && el._item ? levelOf(el._item) : -1; }
      // The rows right below a task that are deeper than it: its sub-tasks
      function kidsOf(li) {

      }

      // Indent or outdent a task; its sub-tasks shift with it.
      // A sub-task can sit at most one level deeper than the row above it.
      function setLevel(list, item, li, lvl) {

        var above = i > 0 ? levelOf(list.rows[i - 1]) : -1;

        var delta = lvl - levelOf(item);
        if (!delta) return;

          withLevel(el._item, lvlEl(el) + delta);
          el.dataset.lvl = String(levelOf(el._item));
        });
        save();
      }

      // Move a task and its sub-tasks past the neighbouring task block (dir -1 up, +1 down)
      function moveBlock(list, ul, li, dir) {
        var block = [li].concat(kidsOf(li)), me = lvlEl(li);

        } else {
          var n = block[block.length - 1].nextElementSibling;
          if (!n || !n._item) return false;
          var nb = [n].concat(kidsOf(n));
          var after = nb[nb.length - 1].nextElementSibling;
          block.forEach(function (el) { ul.insertBefore(el, after); });
        }
        syncOrder(list, ul);
        save();
        return true;
      }

      function removeRow(list, ul, li) {

        save();
      }

      // A button that needs a second tap within 4 s before it acts

      function closeMenus() {

      function toggleEdit(id) {

      function addList() {

      var STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6-4.4-4.2 6-.8z"/></svg>';

      // Starred tasks from all lists. Rebuilt on every save so stars added or removed show up at once.
      function renderMaster() {

      function render(opts) {

          add.setAttribute('aria-label', 'Add a line to ' + label);
          add.innerHTML = '<span class="add-box" aria-hidden="true"></span><span>Add line</span>';
          add.addEventListener('click', function () {
            var nb = blank();
            list.rows.push(nb);
            var el = makeRow(list, nb, ul);
            ul.appendChild(el);
            save();
            var field = el.querySelector('.write');
            field.focus();
            if (field.scrollIntoView) field.scrollIntoView({ block: 'center', behavior: 'smooth' });
          });
          col.appendChild(add);

          colsEl.appendChild(col);
        });

        var tabAdd = h('button', 'tab-add', '+ New list');
        tabAdd.type = 'button';
        tabAdd.addEventListener('click', addList);
        tabsEl.appendChild(tabAdd);

        var colNew = h('div', 'col-new');
        var chipAdd = h('button', 'chip chip-add', '+ New list');
        chipAdd.type = 'button';
        chipAdd.addEventListener('click', addList);
        colNew.appendChild(chipAdd);
        colsEl.appendChild(colNew);

        if (opts.reveal) {
          var target = document.querySelector(opts.reveal);
          if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }
        requestAnimationFrame(fitAll);
        if (opts.focusSel) {
          var f = document.querySelector(opts.focusSel);
          if (f) { f.focus(); if (opts.select && f.select) f.select(); }
        }
      }


      // ---- Sync across devices (phone <-> computer) through /api/lists ----
      var PASS_KEY = 'certpath-todo-pass';
      var LINKED_KEY = 'certpath-todo-linked';
      var BASE_KEY = 'certpath-todo-base';
      function getLS(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
      function setLS(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
      var pass = getLS(PASS_KEY);
      var base = parseInt(getLS(BASE_KEY), 10) || 0;    // server version this device last saw
      var syncMode = pass ? 'busy' : 'off';
      var pushTimer = null, pushing = false, pushAgain = false, retryTimer = null, remoteWaiting = false;

      var syncBtn = h('button', 'sync');
      syncBtn.type = 'button';
      document.body.appendChild(syncBtn);
      var syncPanel = null;
      function paintSync() {
        var t = { off: 'Sync: off', busy: 'Syncing…', ok: 'Synced ✓', error: 'Offline — saved here', wrong: 'Sync: wrong passcode', short: 'Passcode too short (6+)', unavailable: 'Sync not set up yet' }[syncMode];
        syncBtn.textContent = t;
        syncBtn.className = 'sync is-' + syncMode;
      }
      paintSync();

      function typing() {
        var a = document.activeElement;
        return !!(a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.className !== 'pass')));
      }
      function api(method, body) {
        return fetch('/api/lists', {
          method: method,
          cache: 'no-store',
          headers: { 'x-todo-key': pass, 'content-type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; });
        });
      }
      function setBase(v) { base = v || 0; setLS(BASE_KEY, String(base)); }
      function handleFail(j) {
        if (j && j._status === 401) { syncMode = 'wrong'; }
        else if (j && j._status === 400 && j.error === 'too-short') { syncMode = 'short'; }
        else if (j && j._status === 503) { syncMode = 'unavailable'; }
        else {
          syncMode = 'error';
          clearTimeout(retryTimer);
          retryTimer = setTimeout(function () { pull(); }, 15000);
        }
        paintSync();
      }

      // Adopt data from the server, keeping this device's open tab
      function adopt(data, updated) {
        var keep = state.active;
        data.updated = updated;
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
        state = load();
        state.updated = updated;
        if (state.lists.some(function (l) { return l.id === keep; })) state.active = keep;
        render();
      }

      // Combine two copies without losing anything: lists and lines missing from one are added
      function combine(a, b) {
        var out = JSON.parse(JSON.stringify(a));
        b.lists.forEach(function (lb) {
          var la = null;
          out.lists.forEach(function (l) { if (l.id === lb.id) la = l; });
          if (!la) { out.lists.push(JSON.parse(JSON.stringify(lb))); return; }
          var have = {};
          la.rows.forEach(function (r) { if (r.t) have[r.t] = true; });
          var filled = la.rows.filter(function (r) { return r.t || r.d || r.s; });
          lb.rows.forEach(function (r) { if (r.t && !have[r.t]) { filled.push(withLevel({ t: r.t, d: !!r.d, s: !!r.s }, r.i)); have[r.t] = true; } });
          la.rows = filled;
        });
        return out;
      }

      function pull() {
        if (!pass) return Promise.resolve();
        return api('GET').then(function (j) {
          if (j._status !== 200) return handleFail(j);
          var linked = getLS(LINKED_KEY) === '1';
          if (!j.data) { setLS(LINKED_KEY, '1'); setBase(0); return push(); }
          if (!linked) {
            // first time on this device: merge what is here with what is online
            setLS(LINKED_KEY, '1');
            setBase(j.updated);
            adopt(combine(j.data, state), j.updated);
            return push();
          }
          if (j.updated > base) {
            if (typing()) { remoteWaiting = true; syncMode = 'ok'; paintSync(); return; }
            setBase(j.updated);
            adopt(j.data, j.updated);
          } else if ((state.updated || 0) > base) {
            return push();
          }
          syncMode = 'ok';
          paintSync();
        }).catch(function () { handleFail(null); });
      }

      function push() {
        if (!pass) return Promise.resolve();
        pushTimer = null;
        if (pushing) { pushAgain = true; return Promise.resolve(); }
        pushing = true;
        syncMode = 'busy'; paintSync();
        var body = { data: state, updated: state.updated || Date.now(), base: base };
        return api('PUT', body).then(function (j) {
          pushing = false;
          if (j._status === 409 && j.data) {
            // changed on the other device meanwhile: keep both, then save the combined copy
            setBase(j.updated);
            var merged = combine(j.data, state);
            merged.updated = Date.now();
            adopt(merged, merged.updated);
            return push();
          }
          if (j._status !== 200) return handleFail(j);
          setBase(j.updated);
          syncMode = 'ok'; paintSync();
          if (pushAgain) { pushAgain = false; return push(); }
        }).catch(function () { pushing = false; handleFail(null); });
      }

      function schedulePush() {
        if (!pass || syncMode === 'wrong' || syncMode === 'short' || syncMode === 'unavailable') return;
        clearTimeout(pushTimer);
        pushTimer = setTimeout(push, 600);
      }

      function closeSyncPanel() { if (syncPanel) { syncPanel.remove(); syncPanel = null; } }
      syncBtn.addEventListener('click', function () {
        if (syncPanel) { closeSyncPanel(); return; }
        syncPanel = h('div', 'sync-panel');
        var p = h('p', '', pass
          ? 'This device is syncing. Use the same passcode on your phone and computer.'
          : 'Type your sync passcode to keep these lists the same on your phone and computer. The first time, choose one (6 or more characters) and use the same one on every device.');
        var inp = h('input', 'pass');
        inp.type = 'password';
        inp.placeholder = 'Passcode';
        inp.autocomplete = 'current-password';
        inp.value = pass;
        var row = h('div', 'sync-actions');
        var go = h('button', 'link', pass ? 'Update' : 'Turn on sync');
        go.type = 'button';
        go.addEventListener('click', function () {
          var v = inp.value.trim();
          if (!v) return;
          pass = v; setLS(PASS_KEY, v);
          syncMode = 'busy'; paintSync();
          closeSyncPanel();
          pull();
        });
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go.click(); } });
        row.appendChild(go);
        if (pass) {
          var off = h('button', 'link danger', 'Turn off on this device');
          off.type = 'button';
          off.addEventListener('click', function () {
            pass = ''; setLS(PASS_KEY, ''); setLS(LINKED_KEY, ''); setBase(0);
            syncMode = 'off'; paintSync(); closeSyncPanel();
          });
          row.appendChild(off);
        }
        var close = h('button', 'link', 'Close');
        close.type = 'button';
        close.addEventListener('click', closeSyncPanel);
        row.appendChild(close);
        syncPanel.appendChild(p);
        syncPanel.appendChild(inp);
        syncPanel.appendChild(row);
        document.body.appendChild(syncPanel);
        inp.focus();
      });

      // Check for changes from the other device when coming back to the page, and every 20 s while open
      document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
      window.addEventListener('focus', function () { pull(); });
      setInterval(function () { if (!document.hidden && !typing()) pull(); }, 20000);
      document.addEventListener('focusout', function () {
        setTimeout(function () { if (remoteWaiting && !typing()) { remoteWaiting = false; pull(); } }, 50);
      });
      window.addEventListener('pagehide', function () {
        // last-moment send if a change is still waiting
        if (!pass || !pushTimer) return;
        clearTimeout(pushTimer); pushTimer = null;
        try {
          fetch('/api/lists', { method: 'PUT', keepalive: true, headers: { 'x-todo-key': pass, 'content-type': 'application/json' },
            body: JSON.stringify({ data: state, updated: state.updated || Date.now(), base: base }) });
        } catch (e) {}
      });
      pull();
      render();
    })();
  </script>
</body>
</html>
